<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sayfa Bulunamadı | Tekno IPTV</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <style>
    .error-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 2rem;
    }
    .error-page h1 {
      font-size: clamp(3rem, 10vw, 6rem);
      margin: 0;
      background: linear-gradient(135deg, #06b6d4, #8b5cf6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .error-page p {
      color: #94a3b8;
      max-width: 40ch;
      margin: 1rem auto 2rem;
    }
  </style>
</head>
<body>
  <main class="error-page">
    <div>
      <h1>404</h1>
      <p>Aradığınız sayfa bulunamadı. Ana sayfaya dönerek Tekno IPTV paketlerini ve test yayınını inceleyebilirsiniz.</p>
      <a href="index.html" class="btn btn-primary">Ana Sayfaya Dön</a>
    </div>
  </main>
</body>
</html>
